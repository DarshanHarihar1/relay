[project]
name = "relay-api"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.10.6",
  "cryptography>=44,<45",
  "firebase-admin>=6.5,<7",
  "httpx==0.28.1",
  "uvicorn==0.30.6",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "emulator: requires the local Firestore emulator",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
