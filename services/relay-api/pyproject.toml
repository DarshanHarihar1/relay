[project]
name = "relay-api"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography>=44,<45",
  "fastapi>=0.115,<1",
  "firebase-admin>=6.5,<7",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
