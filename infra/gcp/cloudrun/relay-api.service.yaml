apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: relay-api
  annotations:
    relay.dev/region: asia-south1
    # Publicly reachable because the browser OAuth callback and Pub/Sub push
    # both originate outside the VPC. Every route authenticates itself:
    # Firebase ID token on user routes, and full Google OIDC verification
    # (issuer, exact audience, exact service account, email_verified) on
    # /v1/events/gmail and /internal/maintenance/daily.
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "true"
    relay.dev/pubsub-route: /v1/events/gmail
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: relay-api-sa@__PROJECT_ID__.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/__PROJECT_ID__/relay/relay-api:latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          env:
            # Non-secret. The push route accepts only an OIDC token minted for
            # this service account with the configured audience.
            # Non-secret. The OAuth client secret is mounted from Secret Manager below.
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: 248144890838-je2nd969tue4keml65272ssn6tq3bhes.apps.googleusercontent.com
            - name: GOOGLE_CLOUD_PROJECT
              value: __PROJECT_ID__
            # Firebase ID tokens on /v1/me and /v1/google/* are verified against this.
            - name: FIREBASE_PROJECT_ID
              value: __PROJECT_ID__
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GOOGLE_CLOUD_REGION
              value: asia-south1
            - name: RELAY_GEMINI_MODEL
              value: gemini-2.5-flash
            - name: GOOGLE_GMAIL_TOPIC
              value: projects/__PROJECT_ID__/topics/gmail-events
            - name: RELAY_WORK_TOPIC
              value: relay-work
            # Set at deploy time from the service URL and the user's Gmail label.
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: https://SERVICE_URL/v1/google/callback
            - name: GOOGLE_PUBSUB_PUSH_AUDIENCE
              value: https://SERVICE_URL/v1/events/gmail
            - name: GOOGLE_GMAIL_LABEL_ID
              value: Label_REPLACE_ME
            - name: GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT
              value: relay-api-sa@__PROJECT_ID__.iam.gserviceaccount.com
            - name: RELAY_PUBLIC_BASE_URL
              value: https://SERVICE_URL
            - name: VAPI_SERVER_URL
              value: https://SERVICE_URL/v1/webhooks/vapi
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OAUTH_CLIENT_SECRET
                  key: latest
            - name: GOOGLE_OAUTH_STATE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OAUTH_STATE_SIGNING_KEY
                  key: latest
            - name: VAPI_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: VAPI_WEBHOOK_SECRET
                  key: latest
            # MAPS_API_KEY returns when Phase 3 actually calls Routes and Places.
            # Mounting a secret no code reads would only add surface.
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: APP_ENCRYPTION_KEY
                  key: latest
