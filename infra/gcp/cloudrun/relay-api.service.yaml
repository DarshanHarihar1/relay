apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: relay-api
  labels:
    relay.dev/region: asia-south1
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
    run.googleapis.com/invoker-iam-disabled: "false"
    relay.dev/pubsub-route: /v1/events/gmail
spec:
  template:
    spec:
      serviceAccountName: relay-api-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/relay/relay-api:latest
          env:
            # Non-secret. The push route accepts only an OIDC token minted for
            # this service account with the configured audience.
            - name: GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT
              value: relay-api-sa@PROJECT_ID.iam.gserviceaccount.com
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OAUTH_CLIENT_SECRET
                  key: latest
            - name: GOOGLE_OAUTH_STATE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OAUTH_STATE_SIGNING_KEY
                  key: latest
            - name: MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: MAPS_API_KEY
                  key: latest
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: APP_ENCRYPTION_KEY
                  key: latest
